<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mechanics Phenomena Visualized</title>
  <meta name="description" content="An interactive gravity sandbox — n-body mechanics, orbits, and collisions." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* === Page shell (matches the portfolio nav/footer so the new page
       feels like it belongs on the site) === */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: #05070d;
      color: #e6ecf5;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Site nav (a cut-down replica of projects.html nav so we keep the
       visual brand but let the simulation own the rest of the page) */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(8px);
      background: rgba(5, 7, 13, 0.78);
      border-bottom: 1px solid rgba(120, 180, 255, 0.08);
    }
    .nav {
      max-width: 1200px;
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .nav-brand {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 700;
      font-size: 22px;
      color: #e6ecf5;
      text-decoration: none;
      letter-spacing: 0.3px;
    }
    .nav-brand span { color: #7cb4ff; }
    .nav-links {
      display: flex;
      gap: 28px;
      list-style: none;
    }
    .nav-links a {
      color: #c9d5e6;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      transition: color 0.18s ease;
    }
    .nav-links a:hover, .nav-links a.active { color: #7cb4ff; }
    .nav-toggle { display: none; }

    @media (max-width: 760px) {
      .nav-links {
        display: none;
        position: absolute;
        top: 100%;
        right: 12px;
        flex-direction: column;
        gap: 14px;
        background: #0b1020;
        padding: 18px 22px;
        border-radius: 10px;
        border: 1px solid rgba(120, 180, 255, 0.15);
      }
      .nav-links.open { display: flex; }
      .nav-toggle {
        display: inline-flex;
        flex-direction: column;
        gap: 4px;
        background: transparent;
        border: none;
        cursor: pointer;
        padding: 4px;
      }
      .nav-toggle span {
        display: block;
        width: 22px;
        height: 2px;
        background: #c9d5e6;
      }
    }

    /* === Simulation layout === */
    .sim-wrap {
      position: relative;
      width: 100%;
      min-height: calc(100vh - 60px);
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 30%, #0b1020 0%, #05070d 60%, #020308 100%);
    }

    /* Starfield twinkle (decorative) */
    .stars {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(1px 1px at 12% 22%, rgba(180,210,255,0.8), transparent 50%),
        radial-gradient(1px 1px at 34% 67%, rgba(200,220,255,0.6), transparent 50%),
        radial-gradient(1px 1px at 55% 14%, rgba(160,190,255,0.7), transparent 50%),
        radial-gradient(1px 1px at 72% 50%, rgba(210,230,255,0.5), transparent 50%),
        radial-gradient(1px 1px at 88% 80%, rgba(180,210,255,0.7), transparent 50%),
        radial-gradient(1px 1px at 22% 88%, rgba(220,235,255,0.5), transparent 50%),
        radial-gradient(1px 1px at 48% 92%, rgba(170,200,255,0.8), transparent 50%),
        radial-gradient(1px 1px at 78% 18%, rgba(190,220,255,0.6), transparent 50%),
        radial-gradient(1px 1px at 92% 42%, rgba(200,220,255,0.5), transparent 50%),
        radial-gradient(1px 1px at 5% 55%, rgba(180,210,255,0.7), transparent 50%);
      opacity: 0.9;
    }

    canvas#gravity {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }

    /* === Title bar === */
    .title-bar {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      padding: 10px 26px;
      border: 1px solid rgba(124, 180, 255, 0.22);
      border-radius: 10px;
      background: linear-gradient(180deg, rgba(16,24,48,0.85), rgba(10,15,32,0.85));
      backdrop-filter: blur(6px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.45), inset 0 0 14px rgba(124, 180, 255, 0.06);
      text-align: center;
    }
    .title-bar h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 19px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #dbe7ff;
      text-shadow: 0 0 8px rgba(124, 180, 255, 0.25);
    }

    /* === Control panel (top-left) === */
    .controls {
      position: absolute;
      top: 18px;
      left: 18px;
      z-index: 5;
      width: 260px;
      padding: 16px 18px;
      border-radius: 12px;
      border: 1px solid rgba(124, 180, 255, 0.22);
      background: linear-gradient(180deg, rgba(16,24,48,0.88), rgba(10,15,32,0.88));
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.45), inset 0 0 14px rgba(124,180,255,0.06);
    }
    .ctrl-row { margin-bottom: 12px; }
    .ctrl-row:last-child { margin-bottom: 0; }
    .ctrl-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 600;
      color: #9cb5d9;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .ctrl-value { color: #dbe7ff; font-variant-numeric: tabular-nums; }
    input[type="range"] {
      width: 100%;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      background: linear-gradient(90deg, #1c2a4a, #2c4476);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #7cb4ff;
      border: 2px solid #0b1020;
      box-shadow: 0 0 8px rgba(124, 180, 255, 0.6);
      cursor: pointer;
    }
    input[type="range"]::-moz-range-thumb {
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #7cb4ff;
      border: 2px solid #0b1020;
      box-shadow: 0 0 8px rgba(124, 180, 255, 0.6);
      cursor: pointer;
    }

    .toggles {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .toggle {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #c9d5e6;
      cursor: pointer;
      user-select: none;
    }
    .toggle input { display: none; }
    .toggle-switch {
      width: 34px; height: 18px;
      border-radius: 9px;
      background: #1c2a4a;
      position: relative;
      transition: background 0.2s ease;
      flex-shrink: 0;
    }
    .toggle-switch::after {
      content: '';
      position: absolute;
      top: 2px; left: 2px;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #8da3c8;
      transition: left 0.2s ease, background 0.2s ease;
    }
    .toggle input:checked + .toggle-switch { background: #2a4e8a; }
    .toggle input:checked + .toggle-switch::after { left: 18px; background: #7cb4ff; }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }
    .btn {
      padding: 8px 10px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: #dbe7ff;
      background: linear-gradient(180deg, #203562, #15223f);
      border: 1px solid rgba(124, 180, 255, 0.28);
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.18s ease, box-shadow 0.18s ease, transform 0.05s ease;
    }
    .btn:hover { background: linear-gradient(180deg, #294480, #1a2c54); box-shadow: 0 0 14px rgba(124,180,255,0.25); }
    .btn:active { transform: translateY(1px); }
    .btn.wide { grid-column: 1 / -1; }
    .btn.pause.is-paused { background: linear-gradient(180deg, #5c2a2a, #3a1a1a); border-color: rgba(255,124,124,0.4); }

    /* === Ball count (top-right) === */
    .count-chip {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 5;
      padding: 10px 18px;
      border-radius: 20px;
      border: 1px solid rgba(124,180,255,0.22);
      background: linear-gradient(180deg, rgba(16,24,48,0.85), rgba(10,15,32,0.85));
      backdrop-filter: blur(8px);
      font-size: 13px;
      color: #c9d5e6;
    }
    .count-chip strong { color: #dbe7ff; font-size: 17px; font-variant-numeric: tabular-nums; margin-right: 4px; }

    /* === Instruction hint (bottom-center) === */
    .hint {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      padding: 8px 20px;
      border-radius: 20px;
      border: 1px solid rgba(124,180,255,0.18);
      background: rgba(10,15,32,0.7);
      backdrop-filter: blur(6px);
      font-size: 12.5px;
      color: #9cb5d9;
      letter-spacing: 0.3px;
      text-align: center;
      max-width: 92vw;
    }

    /* Dragging preview line */
    .drag-line {
      position: absolute;
      pointer-events: none;
      z-index: 4;
    }

    /* Footer (minimal, same brand) */
    .site-footer {
      background: #05070d;
      border-top: 1px solid rgba(120,180,255,0.08);
      padding: 20px 24px;
      text-align: center;
      font-size: 13px;
      color: #7b8da8;
    }
    .site-footer a { color: #9cb5d9; text-decoration: none; margin: 0 10px; }
    .site-footer a:hover { color: #7cb4ff; }

    @media (max-width: 760px) {
      .title-bar h1 { font-size: 15px; }
      .controls { width: 220px; top: auto; bottom: 56px; left: 8px; width: 210px; padding: 12px 14px; }
      .count-chip { top: auto; bottom: 56px; right: 8px; padding: 6px 12px; font-size: 12px; }
      .hint { bottom: 10px; font-size: 11px; padding: 6px 14px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a href="index.html" class="nav-brand">Yang<span>Zhang</span></a>
      <button class="nav-toggle" aria-label="Toggle menu" onclick="document.getElementById('navLinks').classList.toggle('open')">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="resume.html">Resume</a></li>
        <li><a href="projects.html" class="active">Projects</a></li>
        <li><a href="contact.html">Contact Me</a></li>
      </ul>
    </nav>
  </header>

  <section class="sim-wrap" aria-label="Gravity simulation">
    <div class="stars" aria-hidden="true"></div>

    <div class="title-bar"><h1>Mechanics Phenomena Visualized</h1></div>

    <aside class="controls" aria-label="Simulation controls">
      <div class="ctrl-row">
        <div class="ctrl-label"><span>Gravity (G)</span><span class="ctrl-value" id="gVal">1.00</span></div>
        <input type="range" id="gravitySlider" min="0" max="4" step="0.01" value="1" />
      </div>
      <div class="ctrl-row">
        <div class="ctrl-label"><span>Expansion</span><span class="ctrl-value" id="expVal">0.00</span></div>
        <input type="range" id="expansion" min="-0.2" max="0.2" step="0.005" value="0" />
      </div>
      <div class="ctrl-row">
        <div class="ctrl-label"><span>New Ball Mass</span><span class="ctrl-value" id="massVal">20</span></div>
        <input type="range" id="newMass" min="5" max="200" step="1" value="20" />
      </div>

      <div class="ctrl-row toggles">
        <label class="toggle">
          <span>Motion Trails</span>
          <input type="checkbox" id="trails" checked />
          <span class="toggle-switch"></span>
        </label>
        <label class="toggle">
          <span>Merge on Collision</span>
          <input type="checkbox" id="merging" checked />
          <span class="toggle-switch"></span>
        </label>
      </div>

      <div class="buttons">
        <button type="button" class="btn pause wide" id="pauseBtn">Pause</button>
        <button type="button" class="btn" id="clearBtn">Clear</button>
        <button type="button" class="btn" id="galaxyBtn">Galaxy</button>
        <button type="button" class="btn wide" id="binaryBtn">Binary</button>
      </div>
    </aside>

    <div class="count-chip"><span>Bodies</span> <strong id="ballCount">0</strong></div>

    <canvas id="gravity"></canvas>

    <div class="hint" id="hint">Drag to launch a body &mdash; Click to place at rest &mdash; sliders tune G &amp; expansion</div>
  </section>

  <footer class="site-footer">
    <a href="index.html">Home</a>
    <a href="resume.html">Resume</a>
    <a href="projects.html">Projects</a>
    <a href="contact.html">Contact</a>
  </footer>

  <script>
  (function () {
    "use strict";

    /* ===== Canvas setup ===== */
    var canvas = document.getElementById("gravity");
    var ctx = canvas.getContext("2d");
    var W = 0, H = 0;
    function resize() {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = canvas.parentElement.clientWidth;
      H = canvas.parentElement.clientHeight;
      canvas.style.width = W + "px";
      canvas.style.height = H + "px";
      canvas.width = Math.floor(W * dpr);
      canvas.height = Math.floor(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener("resize", resize);

    /* ===== Simulation state ===== */
    var bodies = [];
    var paused = false;

    // Controls (DOM references)
    var gSlider = document.getElementById("gravitySlider");
    var expSlider = document.getElementById("expansion");
    var massSlider = document.getElementById("newMass");
    var trailsCheck = document.getElementById("trails");
    var mergingCheck = document.getElementById("merging");
    var pauseBtn = document.getElementById("pauseBtn");
    var clearBtn = document.getElementById("clearBtn");
    var galaxyBtn = document.getElementById("galaxyBtn");
    var binaryBtn = document.getElementById("binaryBtn");
    var gVal = document.getElementById("gVal");
    var expVal = document.getElementById("expVal");
    var massVal = document.getElementById("massVal");
    var ballCount = document.getElementById("ballCount");

    /* ===== Physics constants (tunable) ===== */
    var G = parseFloat(gSlider.value);
    var EXP = parseFloat(expSlider.value);
    var NEW_MASS = parseFloat(massSlider.value);
    var SHOW_TRAILS = trailsCheck.checked;
    var MERGE = mergingCheck.checked;

    // Tune G for a pleasant visual — the slider 0..4 maps to a working range
    // because mass units here are arbitrary; we scale at apply-time.
    var G_SCALE = 80; // convert slider G into the force formula

    gSlider.addEventListener("input", function () {
      G = parseFloat(gSlider.value);
      gVal.textContent = G.toFixed(2);
    });
    expSlider.addEventListener("input", function () {
      EXP = parseFloat(expSlider.value);
      expVal.textContent = EXP.toFixed(2);
    });
    massSlider.addEventListener("input", function () {
      NEW_MASS = parseFloat(massSlider.value);
      massVal.textContent = Math.round(NEW_MASS);
    });
    trailsCheck.addEventListener("change", function () { SHOW_TRAILS = trailsCheck.checked; });
    mergingCheck.addEventListener("change", function () { MERGE = mergingCheck.checked; });

    /* ===== Body model =====
       radius ∝ mass^(1/3) so that volume scales with mass (density constant).
       Color gradient from blue-white (light) to red (heavy). */
    function radiusOf(mass) {
      return Math.pow(Math.max(mass, 1), 1 / 3) * 2.2;
    }
    function colorOf(mass) {
      // mass range ~5..500 in presets; clamp to 0..1
      var t = Math.min(1, Math.max(0, (Math.log(mass + 1) - Math.log(6)) / (Math.log(500) - Math.log(6))));
      // t=0 -> cool (blue-white), t=1 -> hot (red)
      var r = Math.round(220 - 40 * t + 35 * t * t); // 220 -> ~255 (red channel up)
      var g = Math.round(230 - 120 * t);            // 230 -> 110
      var b = Math.round(255 - 180 * t);            // 255 -> 75
      return "rgb(" + r + "," + g + "," + b + ")";
    }
    function glowOf(mass) {
      var t = Math.min(1, Math.max(0, (Math.log(mass + 1) - Math.log(6)) / (Math.log(500) - Math.log(6))));
      return 14 + 18 * t; // heavier => bigger glow
    }

    /* ===== Core simulation ===== */
    var lastTs = null;
    function step(ts) {
      var dt = 0.016;
      if (lastTs != null) {
        dt = Math.min(0.05, (ts - lastTs) / 1000);
      }
      lastTs = ts;

      if (!paused) update(dt);
      draw();
      ballCount.textContent = bodies.length;
      requestAnimationFrame(step);
    }

    function update(dt) {
      var n = bodies.length;
      if (!n) return;

      /* 1) Accumulate gravitational accelerations */
      var G_now = G * G_SCALE;
      for (var i = 0; i < n; i++) {
        bodies[i].ax = 0;
        bodies[i].ay = 0;
      }
      for (var a = 0; a < n; a++) {
        for (var b = a + 1; b < n; b++) {
          var A = bodies[a], B = bodies[b];
          var dx = B.x - A.x;
          var dy = B.y - A.y;
          var r2 = dx * dx + dy * dy;
          // Softening — avoids singularity when bodies overlap
          var soft = Math.max(radiusOf(A.mass) + radiusOf(B.mass), 4);
          var denom = Math.max(r2, soft * soft);
          var inv = 1 / (denom * Math.sqrt(denom));
          var f = G_now * inv; // force per unit mass
          A.ax += f * dx * B.mass;
          A.ay += f * dy * B.mass;
          B.ax -= f * dx * A.mass;
          B.ay -= f * dy * A.mass;
        }
      }

      /* 2) Integrate velocities & positions (semi-implicit Euler — stable enough) */
      var expTerm = 1 + EXP;
      for (var i = 0; i < n; i++) {
        var body = bodies[i];
        body.vx = body.vx * expTerm + body.ax * dt;
        body.vy = body.vy * expTerm + body.ay * dt;
        body.x += body.vx * dt;
        body.y += body.vy * dt;
      }

      /* 3) Collisions — merge if MERGE is on and overlapping */
      if (MERGE) {
        for (var a = 0; a < bodies.length; a++) {
          for (var b = a + 1; b < bodies.length; b++) {
            if (b >= bodies.length) break;
            var A = bodies[a], B = bodies[b];
            var dx = B.x - A.x;
            var dy = B.y - A.y;
            var rr = radiusOf(A.mass) + radiusOf(B.mass);
            if (dx * dx + dy * dy <= rr * rr) {
              mergeBodies(A, B, a, b);
              // Step back; indices shift if we merged
              b--;
              break;
            }
          }
        }
      }

      /* 4) Cull bodies that drifted far off-screen (keeps count bounded) */
      var margin = 200;
      for (var i = bodies.length - 1; i >= 0; i--) {
        var b = bodies[i];
        if (b.x < -margin || b.x > W + margin || b.y < -margin || b.y > H + margin) {
          // Only remove if also moving away reasonably slowly — avoids deleting
          // transiently-overdamped bodies that might swing back.
          var speed2 = b.vx * b.vx + b.vy * b.vy;
          if (speed2 < 2500) bodies.splice(i, 1);
        }
      }
    }

    function mergeBodies(A, B, idxA, idxB) {
      // Conserve momentum: v_new = (m_A v_A + m_B v_B) / (m_A + m_B)
      var m = A.mass + B.mass;
      A.vx = (A.mass * A.vx + B.mass * B.vx) / m;
      A.vy = (A.mass * A.vy + B.mass * B.vy) / m;
      // Center of mass position
      A.x = (A.mass * A.x + B.mass * B.x) / m;
      A.y = (A.mass * A.y + B.mass * B.y) / m;
      A.mass = m;
      A.merged = true; // for a tiny flash effect
      bodies.splice(idxB, 1);
    }

    /* ===== Drawing ===== */
    function draw() {
      // Motion trail: paint a semi-transparent black rectangle instead of
      // storing per-body position history — much faster.
      if (SHOW_TRAILS) {
        ctx.fillStyle = "rgba(5, 7, 13, 0.15)";
        ctx.fillRect(0, 0, W, H);
      } else {
        ctx.fillStyle = "#05070d";
        ctx.fillRect(0, 0, W, H);
      }

      for (var i = 0; i < bodies.length; i++) {
        drawBody(bodies[i]);
      }

      // Dragging preview
      if (dragState.active) drawDrag();
    }

    function drawBody(body) {
      var r = radiusOf(body.mass);
      var color = colorOf(body.mass);
      var glow = glowOf(body.mass);

      ctx.save();
      ctx.shadowColor = color;
      ctx.shadowBlur = glow;

      // Inner bright core
      var grad = ctx.createRadialGradient(body.x, body.y, 0, body.x, body.y, r);
      grad.addColorStop(0, "rgba(255,255,255,0.9)");
      grad.addColorStop(0.35, color);
      grad.addColorStop(1, "rgba(0,0,0,0.1)");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(body.x, body.y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    /* ===== Interaction: click to place, drag to slingshot ===== */
    var dragState = {
      active: false,
      sx: 0, sy: 0,
      ex: 0, ey: 0,
      moved: false
    };

    function posFromEvent(e) {
      var rect = canvas.getBoundingClientRect();
      var cx = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
      var cy = (e.touches && e.touches[0]) ? e.touches[0].clientY : e.clientY;
      return { x: cx - rect.left, y: cy - rect.top };
    }

    function onDown(e) {
      e.preventDefault();
      var p = posFromEvent(e);
      dragState.active = true;
      dragState.sx = dragState.ex = p.x;
      dragState.sy = dragState.ey = p.y;
      dragState.moved = false;
    }
    function onMove(e) {
      if (!dragState.active) return;
      e.preventDefault();
      var p = posFromEvent(e);
      dragState.ex = p.x;
      dragState.ey = p.y;
      var dx = dragState.ex - dragState.sx;
      var dy = dragState.ey - dragState.sy;
      if (dx * dx + dy * dy > 4) dragState.moved = true;
    }
    function onUp(e) {
      if (!dragState.active) return;
      e.preventDefault();
      dragState.active = false;

      if (!dragState.moved) {
        // Click → place at rest
        spawnBody(dragState.sx, dragState.sy, 0, 0, NEW_MASS);
      } else {
        // Drag → slingshot. Velocity proportional to drag distance
        // Flip direction: user drags away from spawn point → body flies
        // opposite to the drag vector (sling behaviour).
        var dx = dragState.sx - dragState.ex;
        var dy = dragState.sy - dragState.ey;
        var speedFactor = 0.08; // pixels drag → velocity units
        var vx = dx * speedFactor;
        var vy = dy * speedFactor;
        spawnBody(dragState.sx, dragState.sy, vx, vy, NEW_MASS);
      }
    }

    canvas.addEventListener("mousedown", onDown);
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
    canvas.addEventListener("touchstart", onDown, { passive: false });
    window.addEventListener("touchmove", onMove, { passive: false });
    window.addEventListener("touchend", onUp, { passive: false });

    function drawDrag() {
      var dx = dragState.sx - dragState.ex;
      var dy = dragState.sy - dragState.ey;
      var mag = Math.sqrt(dx * dx + dy * dy);
      var previewMass = NEW_MASS;
      var r = radiusOf(previewMass);
      var color = colorOf(previewMass);

      // Dashed line showing direction
      ctx.save();
      ctx.strokeStyle = "rgba(124, 180, 255, 0.6)";
      ctx.setLineDash([6, 6]);
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(dragState.sx, dragState.sy);
      // Preview speed arrow length
      var previewLen = Math.min(mag, 180);
      var nx = mag ? dx / mag : 0;
      var ny = mag ? dy / mag : 0;
      ctx.lineTo(dragState.sx + nx * previewLen, dragState.sy + ny * previewLen);
      ctx.stroke();
      ctx.setLineDash([]);

      // Ghost body at spawn
      ctx.globalAlpha = 0.6;
      ctx.shadowColor = color;
      ctx.shadowBlur = glowOf(previewMass);
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(dragState.sx, dragState.sy, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function spawnBody(x, y, vx, vy, mass) {
      bodies.push({ x: x, y: y, vx: vx, vy: vy, mass: mass, ax: 0, ay: 0 });
      capBodies();
    }

    function capBodies() {
      // Hard cap to keep frame rate honest. Lighter bodies die first.
      var MAX = 220;
      if (bodies.length > MAX) {
        bodies.sort(function (a, b) { return a.mass - b.mass; });
        bodies.splice(0, bodies.length - MAX);
      }
    }

    /* ===== Presets (Galaxy & Binary) =====
       Both use circular orbital velocity v = sqrt(G·M_central / r) so the
       systems are dynamically stable when G is at its default 1.0. We draw
       velocities perpendicular to the radius vector from the orbit center. */

    function orbitalVelocity(r, M_central) {
      // v = sqrt(G*G_SCALE * M_central / r)
      return Math.sqrt(G * G_SCALE * M_central / Math.max(r, 1));
    }

    function galaxyPreset() {
      bodies.length = 0;
      var cx = W / 2, cy = H / 2;
      var starMass = 180;
      spawnBody(cx, cy, 0, 0, starMass);

      var nOuter = 38;
      for (var i = 0; i < nOuter; i++) {
        var angle = Math.random() * Math.PI * 2;
        var r = 80 + Math.random() * 170; // 80..250 from center
        var x = cx + Math.cos(angle) * r;
        var y = cy + Math.sin(angle) * r;
        var v = orbitalVelocity(r, starMass);
        // Perpendicular direction: (-sin, cos) for counter-clockwise
        var vx = -Math.sin(angle) * v;
        var vy = Math.cos(angle) * v;
        var m = 6 + Math.random() * 14;
        spawnBody(x, y, vx, vy, m);
      }

      // A few slightly heavier "planets" in closer orbits
      var nInner = 8;
      for (var j = 0; j < nInner; j++) {
        var a2 = Math.random() * Math.PI * 2;
        var r2 = 40 + Math.random() * 30;
        var x2 = cx + Math.cos(a2) * r2;
        var y2 = cy + Math.sin(a2) * r2;
        var v2 = orbitalVelocity(r2, starMass);
        // Counter-rotate the inner ones a bit for visual variety
        var vx2 = Math.sin(a2) * v2;
        var vy2 = -Math.cos(a2) * v2;
        spawnBody(x2, y2, vx2, vy2, 20 + Math.random() * 25);
      }
    }

    function binaryPreset() {
      bodies.length = 0;
      var cx = W / 2, cy = H / 2;
      var sep = 140;
      var M1 = 150, M2 = 150;
      // Barycenter is at the midpoint when equal masses.
      var r1 = sep * M2 / (M1 + M2); // 70
      var r2 = sep * M1 / (M1 + M2); // 70

      // Initial positions: along horizontal axis, barycenter at origin.
      var x1 = cx - r1, y1 = cy;
      var x2 = cx + r2, y2 = cy;

      // Orbital velocity for each around the barycenter.
      var v = orbitalVelocity(r1, M2); // either r works since M1=M2
      spawnBody(x1, y1, 0, -v, M1);
      spawnBody(x2, y2, 0, +v, M2);

      // Asteroids orbiting the barycenter outside the pair
      var n = 22;
      var totalMass = M1 + M2;
      for (var i = 0; i < n; i++) {
        var angle = Math.random() * Math.PI * 2;
        var r = 200 + Math.random() * 120;
        var x = cx + Math.cos(angle) * r;
        var y = cy + Math.sin(angle) * r;
        var vv = orbitalVelocity(r, totalMass);
        var vx = -Math.sin(angle) * vv;
        var vy = Math.cos(angle) * vv;
        var m = 4 + Math.random() * 10;
        spawnBody(x, y, vx, vy, m);
      }
    }

    /* ===== Buttons ===== */
    pauseBtn.addEventListener("click", function () {
      paused = !paused;
      pauseBtn.textContent = paused ? "Resume" : "Pause";
      pauseBtn.classList.toggle("is-paused", paused);
    });
    clearBtn.addEventListener("click", function () { bodies.length = 0; });
    galaxyBtn.addEventListener("click", function () { galaxyPreset(); });
    binaryBtn.addEventListener("click", function () { binaryPreset(); });

    /* ===== Boot ===== */
    // Kick a little so we can tell page loaded even before Galaxy auto-load below runs.
    // Wait one frame so the canvas resize has finished before spawning.
    requestAnimationFrame(function () {
      galaxyPreset();
    });
    requestAnimationFrame(step);

  })();
  </script>
</body>
</html>
